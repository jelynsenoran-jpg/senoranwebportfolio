<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body class="registration-page">

  <header>
    <h1>My Personal Website</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="registration.html">Registration</a>
    <a href="grade.html">Grade</a>
    <a href="profile.html">Profile</a>
  </nav>

  <main class="registration">
    <h2>Student Registration Form</h2>

    <form action="#" method="post">

      <div class="field">
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Student FullName">
      </div>

      <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email">
      </div>

      <div class="field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password">
      </div>

      <div class="field">
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" >
        <label for="male" style="display:inline">Male</label>
        <input type="radio" id="female" name="gender" value="Female" checked>
        <label for="female" style="display:inline">Female</label>
      </div>

      <div class="field">
        <label for="course">Course:</label>
        <select id="course" name="course">
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
          <option value="BSIS">BSIS</option>
        </select>
      </div>

      <div class="field">
        <label>Skills:</label>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html" style="display:inline">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css" style="display:inline">CSS</label>
        <input type="checkbox" id="js" name="skills" value="JAVASCRIPT">
        <label for="js" style="display:inline">JAVASCRIPT</label>
      </div>

      <div class="field">
        <label for="picture">Profile Picture:</label>
        <input type="file" id="picture" name="picture">
      </div>

      <div class="field">
        <textarea name="address" placeholder="Enter your Address"></textarea>
        <button type="submit">submit</button>
        <button type="reset">reset</button>
      </div>

    </form>
  </main>
                  <a href="../index.html" class="back-portfolio-btn">
        ⬅ Go back to Portfolio
    </a>

  <footer>
    <p>Copyrights@2026</p>
  </footer>

</body>
</html>
</body>
</html>
