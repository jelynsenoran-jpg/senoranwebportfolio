<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1dc" />
      <stop offset="50%" stop-color="#ffe4e1" />
      <stop offset="100%" stop-color="#ffb6c1" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2e2b" />
      <stop offset="100%" stop-color="#2a1715" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ff4d79" />
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#ff80a0" stroke-width="8" />

  <!-- Cute sparkles around -->
  <g fill="#ff7597" opacity="0.8">
    <path d="M70,90 Q80,90 80,80 Q80,90 90,90 Q80,90 80,100 Q80,90 70,90 Z" />
    <path d="M320,110 Q330,110 330,100 Q330,110 340,110 Q330,110 330,120 Q330,110 320,110 Z" />
    <path d="M50,230 Q60,230 60,220 Q60,230 70,230 Q60,230 60,240 Q60,230 50,230 Z" />
    <path d="M330,260 Q340,260 340,250 Q340,260 350,260 Q340,260 340,270 Q340,260 330,260 Z" />
    <circle cx="110" cy="60" r="4" fill="#ffb3c6" />
    <circle cx="290" cy="70" r="5" fill="#ffb3c6" />
  </g>

  <!-- Hair Back -->
  <path d="M120,170 C100,240 100,310 130,350 C140,300 150,260 150,230 Z" fill="url(#hairGrad)" />
  <path d="M280,170 C300,240 300,310 270,350 C260,300 250,260 250,230 Z" fill="url(#hairGrad)" />

  <!-- Body / Sweater -->
  <path d="M130,320 C130,280 160,260 200,260 C240,260 270,280 270,320 L285,400 L115,400 Z" fill="url(#sweaterGrad)" />
  <!-- Sweater Collar -->
  <path d="M170,260 C185,285 215,285 230,260 C220,295 180,295 170,260 Z" fill="#ffffff" />

  <!-- Neck -->
  <rect x="185" y="220" width="30" height="45" rx="10" fill="#fed7c3" />
  <path d="M185,240 C195,250 205,250 215,240 L215,255 C200,265 190,260 185,255 Z" fill="#fbc4ab" />

  <!-- Head / Face -->
  <path d="M140,165 C140,120 165,105 200,105 C235,105 260,120 260,165 C260,215 235,240 200,240 C165,240 140,215 140,165 Z" fill="#ffe5d9" />

  <!-- Blush -->
  <ellipse cx="160" cy="195" rx="14" ry="7" fill="#ff9aa2" opacity="0.6" />
  <ellipse cx="240" cy="195" rx="14" ry="7" fill="#ff9aa2" opacity="0.6" />

  <!-- Eyes -->
  <ellipse cx="170" cy="175" rx="8" ry="11" fill="#2a1715" />
  <ellipse cx="230" cy="175" rx="8" ry="11" fill="#2a1715" />
  <!-- Eye highlights -->
  <circle cx="168" cy="172" r="3.5" fill="#ffffff" />
  <circle cx="173" cy="178" r="1.5" fill="#ffffff" />
  <circle cx="228" cy="172" r="3.5" fill="#ffffff" />
  <circle cx="233" cy="178" r="1.5" fill="#ffffff" />

  <!-- Eyelashes -->
  <path d="M160,167 Q170,162 180,167" stroke="#2a1715" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M220,167 Q230,162 240,167" stroke="#2a1715" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Cute Smile -->
  <path d="M193,205 Q200,212 207,205" stroke="#e07a5f" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Hair Front / Bangs -->
  <path d="M135,160 C135,110 160,95 200,95 C240,95 265,110 265,160 C265,175 260,185 255,190 C250,150 245,140 230,135 C215,130 205,145 195,145 C185,145 175,130 160,138 C148,145 145,165 140,190 C137,180 135,170 135,160 Z" fill="url(#hairGrad)" />

  <!-- Cute Pink Hair Ribbon / Bow -->
  <g transform="translate(190, 85)">
    <!-- Center knot -->
    <circle cx="10" cy="10" r="7" fill="url(#ribbonGrad)" />
    <!-- Left loop -->
    <ellipse cx="-5" cy="5" rx="14" ry="9" fill="url(#ribbonGrad)" transform="rotate(-20 -5 5)" />
    <!-- Right loop -->
    <ellipse cx="25" cy="5" rx="14" ry="9" fill="url(#ribbonGrad)" transform="rotate(20 25 5)" />
    <!-- Ribbon tails -->
    <path d="M5,15 Q-5,30 -8,38 Q0,32 10,20 Z" fill="url(#ribbonGrad)" />
    <path d="M15,15 Q25,30 28,38 Q20,32 10,20 Z" fill="url(#ribbonGrad)" />
  </g>

  <!-- Cute glasses -->
  <circle cx="170" cy="175" r="18" fill="none" stroke="#ff7597" stroke-width="3" />
  <circle cx="230" cy="175" r="18" fill="none" stroke="#ff7597" stroke-width="3" />
  <path d="M188,175 Q200,170 212,175" stroke="#ff7597" stroke-width="3" fill="none" />
</svg>
